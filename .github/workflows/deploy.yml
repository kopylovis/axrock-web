name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Ежечасная пересборка подтягивает контент, опубликованный в админке.
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-site]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Слева — имена, которые ждёт сборка; справа — переменные репозитория.
      # Префикс AXROCK_ отделяет их от настроек других проектов в этом аккаунте.
      - run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: ${{ vars.AXROCK_SITE_URL || 'https://axrock.band' }}
          VITE_API_BASE_URL: ${{ vars.AXROCK_API_BASE_URL || 'https://api.monoroh.com/api/axrock' }}
          # Подпапка project-page, например /axrock-web/. Пусто — сайт отдаётся из корня.
          VITE_BASE_PATH: ${{ vars.AXROCK_BASE_PATH || '/' }}
          # Пока переменная пуста, файл CNAME не пишется и Pages отдаёт сайт на github.io.
          SITE_CNAME: ${{ vars.AXROCK_SITE_CNAME }}
          # Черновой адрес закрываем от поисковиков, чтобы он не конкурировал с боевым.
          # Одна переменная питает и robots.txt, и мета-тег в разметке.
          SITE_NOINDEX: ${{ vars.AXROCK_SITE_NOINDEX }}
          VITE_SITE_NOINDEX: ${{ vars.AXROCK_SITE_NOINDEX }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
